import java.nio.file.Paths
import org.gradle.internal.os.OperatingSystem

plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
    id 'com.google.firebase.crashlytics'
    id 'org.telegram.lottie-meta'
    id 'idea'
}

idea {
    module {
        excludeDirs += [
            file('jni/third_party'),
            file('jni/ffmpeg'),
            file('jni/tlottie'),
            file('jni/boringssl'),
            file('jni/sqlite')
        ]
    }
}

def buildTimestamp = System.getenv('BUILD_TIMESTAMP') ?: '0'
def commitId = System.getenv('COMMIT_ID')
def verName = "${APP_VERSION_NAME}${commitId?.take(7) ? "-${commitId.take(7)}" : ''}"
def verCode = 1261

def officialVer = APP_VERSION_NAME
def officialCode = APP_VERSION_CODE

def keystorePwd = null
def alias = null
def pwd = null

Properties properties
def base64 = System.getenv('LOCAL_PROPERTIES')
if (base64 != null && !base64.isBlank()) {
    properties = new Properties()
    properties.load(new ByteArrayInputStream(Base64.decoder.decode(base64)))
} else if (project.rootProject.file('local.properties').exists()) {
    properties = new Properties()
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}

if (properties != null) {
    keystorePwd = properties.getProperty('KEYSTORE_PASS')
    alias = properties.getProperty('ALIAS_NAME')
    pwd = properties.getProperty('ALIAS_PASS')
}

keystorePwd = keystorePwd ?: System.getenv('KEYSTORE_PASS')
alias = alias ?: System.getenv('ALIAS_NAME')
pwd = pwd ?: System.getenv('ALIAS_PASS')

def nativeTarget = System.getenv('NATIVE_TARGET') ?: ''

if (nativeTarget == 'SKIP') {
    tasks.configureEach { task ->
        if (
            task.name.toLowerCase().contains('cmake') ||
            task.name.toLowerCase().contains('jni') ||
            task.name.toLowerCase().contains('test')
        ) {
            task.enabled = false
        }
    }
}

android {
    // MeeroX v255.1 hotfix: resValue (beta label) needs this feature on
    // (CI caught its absence: "custom resource values, but the feature is disabled").
    buildFeatures {
        resValues = true
    }
    def meeroPkg = System.getenv('MEERO_PACKAGE')
    defaultConfig.applicationId = (meeroPkg != null && !meeroPkg.isEmpty()) ? meeroPkg : APP_PACKAGE
    def meeroLabel = System.getenv('MEERO_APP_LABEL')
    defaultConfig.resValue 'string', 'NagramX', ((meeroLabel != null && !meeroLabel.isEmpty()) ? meeroLabel : 'MeeroX') // MeeroX v255: beta side-load label

    androidResources {
        localeFilters += [
                'en', 'ar', 'de', 'es', 'es-rES', 'fa-rIR', 'in-rID', 'it', 'it-rIT', 'ja-rJP',
                'ko', 'nl', 'pl-rPL', 'pt-rBR', 'ru-rRU', 'tr-rTR', 'uk-rUA', 'vi-rVN', 'zh-rCN', 'zh-rTW'
        ]
    }

    packaging {
        jniLibs {
            useLegacyPackaging = true
        }
    }

    splits {
        abi {
            enable = true
            reset()
            universalApk = false
            if (nativeTarget == 'universal') {
                universalApk = true
                include 'armeabi-v7a', 'arm64-v8a', 'x86', 'x86_64'
            } else if (!nativeTarget.isBlank()) {
                include nativeTarget
            } else {
                include 'arm64-v8a', 'x86_64'
            }
        }
    }

    defaultConfig {
        versionName verName
        versionCode verCode

        // obtain your own keys at https://core.telegram.org/api/obtaining_api_id
        // MeeroGram/MeeroX: app id 6 is an old test credential that Telegram
        // now restricts - the server answers auth.sendCode with
        // TL_auth_sentCodePaymentRequired ("SMS Fee") instead of delivering a
        // code. Id 4 is the one the official Android client and every major
        // fork (Nagram, Telegram-FOSS) ship, and it delivers codes normally.
        // MeeroX: Nagram's registered credential, not one of the shared
        // public ids.
        //
        // Id 4 is the official Android client's and Telegram rates it per
        // device - the first sign-in on a device works and the second is
        // refused before a code is sent, which is how "add another account"
        // failed here. Id 6, which NagramX ships, is worse in a different way:
        // every build of every fork that inherits it draws on one quota, and
        // new sign-ins come back as an internal error. Id 11535358 belongs to
        // Nagram alone, so it is not competing with the whole ecosystem.
        //
        // MeeroApiKeys keeps this and the others as a pool and rotates when
        // the server rejects a key, so no single id going bad locks anyone out.
        //
        // v199 EXPERIMENT (owner-ordered fork-harvest): v198 proved login
        // sound again under Nagram's 11535358 but the phantom community cap
        // persists under it, and v197 proved official ids can never create a
        // session on our signature. Remaining question, decisive either way:
        // is the server cap PER api_id (some third-party ids walk free) or
        // PER CLASS (every non-official id capped)? Test identity: nullgram's
        // published pair 19797609 / e8f1567dbbf38944a1391c4d23c34b60 (their
        // own registration, taken unmodified from qwq233/nullgram
        // BuildVars.java - public source, credit where due). Result matrix:
        // join works -> per-id cap, this becomes the new default; same
        // phantom screen -> class-wide cap, experiment space exhausted,
        // honest documentation follows. GENERATION bumps to 5 so every saved
        // rotation index resets onto this slot once.
        def appId = '19797609'
        def appHash = 'e8f1567dbbf38944a1391c4d23c34b60'

        if (properties != null) {
            appId = properties.getProperty('TELEGRAM_APP_ID') ?: System.getenv('TELEGRAM_APP_ID') ?: appId
            appHash = properties.getProperty('TELEGRAM_APP_HASH') ?: System.getenv('TELEGRAM_APP_HASH') ?: appHash
        }

        buildConfigField 'String', 'BUILD_VERSION_STRING', '"' + verName + '"'
        buildConfigField 'int', 'MEERO_EDITION', "${MEERO_EDITION}".strip()
        buildConfigField 'String', 'OFFICIAL_VERSION', '"' + officialVer + '"'
        buildConfigField 'int', 'OFFICIAL_VERSION_CODE', officialCode + ''
        buildConfigField 'int', 'APP_ID', appId
        buildConfigField 'String', 'APP_HASH', '"' + appHash + '"'
        buildConfigField 'long', 'BUILD_TIMESTAMP', buildTimestamp + 'L'
        // MeeroX v217 hotfix 2: official 12.10.1's merged sources reference
        // these flags that only upstream's own BuildConfig generation had.
        // False in our release builds = production semantics, zero behavior
        // change, and the merged Java stays byte-faithful to upstream.
        buildConfigField 'boolean', 'DEBUG_PRIVATE_VERSION', 'false'
        buildConfigField 'boolean', 'DEBUG_VERSION', 'false'

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static', '-DANDROID_PLATFORM=android-27', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON'
                System.getenv('PATH').split(File.pathSeparator).any { path ->
                    var file = Paths.get("${path}${File.separator}ccache${if (OperatingSystem.current().windows) ".exe" else ""}").toFile()
                    if (file.exists()) {
                        println("Using ccache ${file.getAbsolutePath()}")
                        arguments += "-DANDROID_CCACHE=${file.getAbsolutePath()}"
                        return true
                    }
                }
            }
        }

        javaCompileOptions {
            annotationProcessorOptions {
                arguments += ['room.schemaLocation': "$projectDir/schemas".toString()]
            }
        }
    }

    bundle {
        language {
            enableSplit = false
        }
    }

    externalNativeBuild {
        cmake {
            version = '3.31.6+'
            path = 'jni/CMakeLists.txt'
        }
    }

    signingConfigs {
        release {
            storeFile project.file('release.keystore')
            storePassword keystorePwd
            keyAlias alias
            keyPassword pwd
        }
    }

    buildTypes {
        debug {
            isDefault = true
            debuggable = true
            jniDebuggable = true
            multiDexEnabled = true
            signingConfig = signingConfigs.release
        }

        staging {
            debuggable = false
            jniDebuggable = false
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
        }

        release {
            debuggable = false
            jniDebuggable = false
            // MeeroX: R8 is the single most expensive task in CI (measured at
            // 8.5 of 22 minutes). -PmeeroSkipMinify=true turns it off for
            // iteration builds; release builds keep it for a smaller APK.
            // Always minify: this is exactly how upstream ships, and a
            // non-minified build differs from the tested configuration.
            minifyEnabled = true
            shrinkResources = true
            multiDexEnabled = true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            matchingFallbacks = ['release', 'staging', 'debug']
            signingConfig = signingConfigs.release
        }
    }

    sourceSets.main.jniLibs.srcDirs = ['./jni/']

    namespace = 'org.telegram.messenger'
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            String gramName = 'MeeroX'
            // MeeroX v266: stamp the edition into the APK file name so he can
            // ALWAYS tell which build he installed (every release used to
            // share one identical name - stale-install roulette is over).
            String first = String.format('%s-v%s(%s)-e%s', gramName, verName, verCode, "${MEERO_EDITION}".strip())
            output.outputFileName.set(
                output.outputFileName.get()
                    .replace('TMessagesProj', first)
                    .replace('-release', '')
                    .replace('-staging', '')
            )
        }
    }
}

configurations.configureEach {
    exclude group: 'androidx.recyclerview', module: 'recyclerview'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}

dependencies {
    // official
    implementation 'androidx.core:core-ktx:1.19.0'
    implementation 'androidx.palette:palette-ktx:1.0.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'
    implementation 'androidx.mediarouter:mediarouter:1.8.1'
    implementation 'com.google.zxing:core:3.5.4'
    implementation 'androidx.sharetarget:sharetarget:1.2.0'
    implementation 'androidx.interpolator:interpolator:1.0.0'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.car.app:app:1.7.0'
    implementation 'androidx.car.app:app-projected:1.7.0'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    compileOnly 'org.checkerframework:checker-qual:2.5.2'
    compileOnly 'org.checkerframework:checker-compat-qual:2.5.0'
    implementation 'com.google.firebase:firebase-messaging:25.1.2'
    implementation 'com.google.firebase:firebase-crashlytics:20.1.0'
    implementation 'com.google.android.gms:play-services-cast-framework:22.3.1'
    implementation 'com.google.android.gms:play-services-maps:20.0.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.gms:play-services-vision:20.1.3'
    implementation 'com.google.android.gms:play-services-wearable:20.0.1'
    implementation 'com.google.android.gms:play-services-location:21.4.0'
    implementation 'com.googlecode.mp4parser:isoparser:1.0.6'
    implementation 'com.google.mlkit:language-id:17.0.6'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation ('com.google.guava:guava:33.6.0-android') {
        exclude group: 'com.google.code.findbugs', module: 'jsr305'
        exclude group: 'org.checkerframework', module: 'checker-compat-qual'
        exclude group: 'org.checkerframework', module: 'checker-qual'
        exclude group: 'com.google.errorprone', module: 'error_prone_annotations'
        exclude group: 'com.google.j2objc', module: 'j2objc-annotations'
        exclude group: 'org.codehaus.mojo', module: 'animal-sniffer-annotations'
    }
    implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
    implementation 'com.google.android.gms:play-services-mlkit-image-labeling:16.0.8'
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "io.noties.markwon:core:4.6.2"
    implementation "io.noties.markwon:ext-strikethrough:4.6.2"
    implementation "io.noties.markwon:ext-tables:4.6.2"
    implementation "io.noties.markwon:html:4.6.2"
    implementation "io.noties.markwon:inline-parser:4.6.2"
    implementation "io.noties.markwon:ext-latex:4.6.2"
    // payment
    implementation('com.stripe:stripe-android:2.0.2') {
        exclude group: 'com.android.support', module: 'support-annotations'
    }
    // MeeroX v217 hotfix 2: official 12.10.1 moved its billing code to the
    // billing-8 API surface; the library must follow (7.x has no
    // QueryProductDetailsResult.getProductDetailsList()).
    implementation 'com.android.billingclient:billing:8.0.0'
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs_nio:2.1.5'

    // kotlin
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.11.0'
    // utilities
    implementation 'org.osmdroid:osmdroid-android:6.1.20'
    // network
    implementation 'com.squareup.okhttp3:okhttp:5.5.0'
    implementation 'dnsjava:dnsjava:3.6.5'
    // add for emoji
    implementation 'com.jaredrummler:truetypeparser-light:1.0.0'
    // add for UnifiedPush
    implementation 'org.unifiedpush.android:connector:3.3.4'
    // add for save deleted messages
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'
    // add for keep formatting in translations
    implementation 'org.apache.commons:commons-text:1.15.0'
    // translator from nekogram
    implementation 'app.nekogram.translator:translator:1.6.1'

    compileOnly fileTree('libs')
}
