name: MeeroX Build

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Optional note for this build'
        required: false
      pkg:
        description: 'Optional package override (beta side-load, e.g. nu.gpu.nagram.beta)'
        required: false
        default: ''
      label:
        description: 'Optional app label override (beta builds)'
        required: false
        default: ''

concurrency:
  group: meerox-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build MeeroX (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # NagramX reads this and restricts the ABI split to a single target.
      # Building one ABI instead of four is the single biggest time saver.
      NATIVE_TARGET: "arm64-v8a"
      MEERO_PACKAGE: ${{ github.event.inputs.pkg }}
      MEERO_APP_LABEL: ${{ github.event.inputs.label }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_HARDLINK: "true"
      CCACHE_NOHASHDIR: "true"
      CCACHE_MAXSIZE: "10G"

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost \
                      /usr/share/swift "$AGENT_TOOLSDIRECTORY" || true
          df -h / | tail -1

      - name: Checkout
        # v7 + recursive submodules, mirroring upstream's own CI: since the
        # 12.9.2 import the native third_party libs (ffmpeg/libvpx/dav1d)
        # live in git submodules, and without this the CMake step fails.
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: meerox-arm64
          append-timestamp: false
          max-size: 10G

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-disabled: true

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: meerox-gradle-${{ hashFiles('**/*.gradle') }}
          restore-keys: meerox-gradle-

      - name: Native build cache
        uses: actions/cache@v4
        with:
          path: |
            TMessagesProj/.cxx
            TMessagesProj/build/intermediates/cxx
          # MeeroX v217 hotfix 2: bump prefix - a stale restored .cxx tree held
          # read-only objects and broke h264_encoder_impl.cc.o ('Operation not
          # permitted'). Fresh prefix = clean rebuild once, then cached again.
          key: meerox-cxx2-arm64-${{ hashFiles('TMessagesProj/jni/**/CMakeLists.txt') }}
          restore-keys: meerox-cxx2-arm64-

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;36.0.0 ndk;27.2.12479018 platforms;android-37.0"

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes nasm

      - name: Configure build
        run: |
          echo "sdk.dir=${ANDROID_HOME}" >> local.properties
          # MeeroX v255.2 hotfix: for beta side-load builds, register the beta
          # package as an extra google-services client locally (CI-only copy).
          # Runtime FCM push needs the package whitelisted in console, so beta
          # builds may rely on foreground polling - expected for a test app.
          if [ -n "$MEERO_PACKAGE" ]; then
            jq --arg pkg "$MEERO_PACKAGE" '.client[0] as $c | .client += [$c | .client_info.android_client_info.package_name = $pkg]' TMessagesProj/google-services.json > /tmp/gs.json && mv /tmp/gs.json TMessagesProj/google-services.json
          fi
          # Signing: the repo ships a debug-usable keystore, reuse it so the
          # APK installs. Passwords come from the upstream defaults.
          # Our own keystore (TMessagesProj/release.keystore is replaced with it),
          # because upstream's is protected by a password we do not have.
          echo "KEYSTORE_PASS=meerox2026" >> local.properties
          echo "ALIAS_NAME=meerox" >> local.properties
          echo "ALIAS_PASS=meerox2026" >> local.properties
          MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)
          MEMORY_GB=$((MEMORY_KB / 1024 / 1024))
          echo "Memory: ${MEMORY_GB}GB"
          if [ $MEMORY_GB -ge 12 ]; then
            sed -i '/^org\.gradle\.jvmargs=/d' gradle.properties
            echo "org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=2G -XX:+UseParallelGC -Dfile.encoding=UTF-8" >> gradle.properties
          fi

      - name: Build
        run: |
          set -o pipefail
          # One build, identical to upstream's release configuration.
          # (android.enableArtProfiles was removed in AGP 8, so the profile
          # task stays; the caches below are what keep the build short.)
          TASK="TMessagesProj:assembleRelease"
          echo "Task: $TASK / ABI: $NATIVE_TARGET"
          ./gradlew $TASK --stacktrace 2>&1 | tee build.log

      # MeeroX v181 (batch 0): the v168-v180 runtime DEX vault (encrypted
      # classesN.dex + stub Application + :meeroboot prep splash) is
      # RETIRED from the boot path. It made first-boot-after-update depend
      # on a 42 MB runtime decrypt - the single source of the 9-version
      # stall saga on heavy devices. Plain classesN.dex now ships in the
      # APK: boot is 100% stock. Only the native core keeps the vault
      # treatment in the step below (cached after first decrypt, proven
      # silent since v167).
      - name: Pack native core into MeeroVault
        # v167: encrypt libtmessages.49.so into assets/meero_vault/core.enc
        # (his WiFi-app packer scheme, done with first-party source). The
        # packer self-tests the blob before writing; it exits non-zero on
        # any anomaly so a broken pack can never ship silently.
        if: success()
        working-directory: TMessagesProj
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          APK=$(find build/outputs/apk -name "*arm64-v8a*.apk" | head -1)
          [ -n "$APK" ] || { echo "no arm64 apk found"; exit 1; }
          echo "packing: $APK (build-tools: $BT)"
          mkdir -p /tmp/mvpack
          javac -d /tmp/mvpack ../tools/MeeroVaultPacker.java
          KS_PASS=$(grep '^KEYSTORE_PASS=' ../local.properties | cut -d= -f2-)
          KS_ALIAS=$(grep '^ALIAS_NAME=' ../local.properties | cut -d= -f2-)
          KS_KEY=$(grep '^ALIAS_PASS=' ../local.properties | cut -d= -f2-)
          java -Xmx2g -cp /tmp/mvpack MeeroVaultPacker "$APK" packed.apk
          # -P 16 = 16KB-page align for uncompressed .so (covers 4K too,
          # and MUST NOT be combined with legacy -p on build-tools >= 35)
          "$BT/zipalign" -f -v -P 16 4 packed.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias "$KS_ALIAS" \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_KEY" \
            --min-sdk-version 27 \
            --out "$APK" aligned.apk
          "$BT/apksigner" verify --print-certs "$APK" | head -3
          echo "--- vault check ---"
          unzip -l "$APK" | grep -E "meero_vault|meerovault|tmessages" || true
          rm -f packed.apk aligned.apk
          echo "MeeroVault pack OK"

      - name: Upload R8 mapping
        # v182 batch 1: mapping.txt lets us verify EXACTLY what was renamed
        # (and retrace stacks later). Lives only in CI artifacts, never in
        # the APK or any public link.
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping
          path: TMessagesProj/build/outputs/mapping/release/
          retention-days: 30

      - name: Collect APKs
        if: success()
        run: |
          mkdir -p out
          find TMessagesProj/build/outputs/apk -name "*.apk" -print
          for f in $(find TMessagesProj/build/outputs/apk -name "*arm64-v8a*.apk"); do
            cp "$f" out/
          done
          # fall back to whatever exists if the arm64 filter matched nothing
          if [ -z "$(ls -A out 2>/dev/null)" ]; then
            find TMessagesProj/build/outputs/apk -name "*.apk" -exec cp {} out/ \;
          fi
          ls -lh out/
          cd out && sha256sum *.apk | tee SHA256SUMS.txt

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MeeroX-apk
          path: out/*
          retention-days: 30

      - name: Upload log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7
